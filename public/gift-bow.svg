<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="loop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8564c"/>
      <stop offset="0.6" stop-color="#c62828"/>
      <stop offset="1" stop-color="#8e1616"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e1616"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="knot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e04a40"/>
      <stop offset="1" stop-color="#9e1b1b"/>
    </linearGradient>
  </defs>

  <!-- Bow, centered and scaled to fill the canvas, tilted diagonally -->
  <g transform="translate(50 50) scale(1.4) rotate(-35) translate(-62 -40)">
    <!-- Tails with notched ends -->
    <path d="M60 40 L48 60 L52.5 59 L54.5 63.5 L64 42 Z" fill="url(#tail)"/>
    <path d="M64 40 L76 60 L71.5 59 L69.5 63.5 L60 42 Z" fill="url(#tail)"/>

    <!-- Loops -->
    <path d="M62 38 C54 21 35 23 39 36 C41 44 54 44 62 38 Z" fill="url(#loop)"/>
    <path d="M62 38 C70 21 89 23 85 36 C83 44 70 44 62 38 Z" fill="url(#loop)"/>

    <!-- Inner folds (depth) -->
    <path d="M62 38 C56 31 47 31 45.5 35.5 C49 38.5 56 39.5 62 38 Z" fill="#7a1010" opacity="0.55"/>
    <path d="M62 38 C68 31 77 31 78.5 35.5 C75 38.5 68 39.5 62 38 Z" fill="#7a1010" opacity="0.55"/>

    <!-- Satin highlights -->
    <g fill="none" stroke="#ff8a7f" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
      <path d="M42 30 C46 25 53 25.5 57 30"/>
      <path d="M82 30 C78 25 71 25.5 67 30"/>
    </g>

    <!-- Knot -->
    <rect x="57" y="33.5" width="10" height="9" rx="3.5" fill="url(#knot)"/>
    <path d="M59.5 35.5 C61 34.8 63 34.8 64.5 35.5" fill="none" stroke="#ff8a7f" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
